<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AlgoCraft 3D - Block Categories & Drag-and-Drop Edition</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="rotate-overlay" class="rotate-overlay">
    <div class="rotate-card">
      <div class="rotate-icon">📱🔄</div>
      <h2>กรุณาหมุนหน้าจอเป็นแนวนอน</h2>
      <p>รองรับการเล่นแบบแนวนอนเต็มหน้าจอ</p>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="logo-badge">⚡ AlgoCraft 3D</span>
      <nav class="shop-tabs" id="shop-tabs">
        <button class="tab-btn active" data-shop="kitchen">🍳 ตามสั่ง</button>
        <button class="tab-btn" data-shop="boba">🧋 ชานม</button>
        <button class="tab-btn" data-shop="repair">📱 ซ่อมมือถือ</button>
      </nav>
    </div>

    <div class="controls-group">
      <select id="difficulty-select" class="select-pill" title="ระดับความยาก">
        <option value="easy">🟢 ง่าย</option>
        <option value="normal">🟡 ปานกลาง</option>
        <option value="hard">🔴 ยาก</option>
        <option value="sandbox">🛠️ Sandbox</option>
      </select>

      <select id="level-select" class="select-pill" title="เลือกด่าน"></select>

      <div class="stats-bar">
        <span class="stat-pill level-pill" id="stat-level">Lv.1</span>
        <span class="stat-pill xp-pill" id="stat-xp">XP 0/100</span>
        <span class="stat-pill coin-pill" id="stat-coins">🪙 200</span>
      </div>

      <button id="btn-market" class="icon-btn market-btn">🛒 ร้านค้า</button>
      <button id="btn-audio" class="icon-btn" title="เสียง">🔊</button>
      <button id="btn-fullscreen" class="icon-btn" title="เต็มจอ">⛶</button>
    </div>
  </header>

  <main class="workspace-grid">
    <!-- Left Column: 6-Category Block Palette -->
    <section class="panel palette-panel">
      <div class="panel-header">
        <h3>🧩 บล็อค (ลากไปวาง)</h3>
        <span class="badge-sub" id="palette-shop-label">ตามสั่ง</span>
      </div>
      <div class="cat-filter-bar" id="cat-filter-bar">
        <button class="cat-chip active" data-cat="all">ทั้งหมด</button>
        <button class="cat-chip" data-cat="motion">Motion</button>
        <button class="cat-chip" data-cat="events">Events</button>
        <button class="cat-chip" data-cat="control">Control</button>
        <button class="cat-chip" data-cat="operation">Operation</button>
        <button class="cat-chip" data-cat="sensing">Sensing</button>
        <button class="cat-chip" data-cat="variable">Variable</button>
      </div>
      <div class="palette-scroll" id="palette-container"></div>
    </section>

    <!-- Center Column: Drag-and-Drop Algorithm Workspace -->
    <section class="panel editor-panel">
      <div class="panel-header">
        <h3>⚙️ พื้นที่ต่อบล็อค (<span id="block-count">0</span>)</h3>
        <div class="editor-actions">
          <button id="btn-sample" class="action-btn sample-btn">💡 ตัวอย่าง</button>
          <button id="btn-clear" class="action-btn clear-btn">🗑️ ล้าง</button>
          <button id="btn-stop" class="action-btn stop-btn" disabled>⏹ หยุด</button>
          <button id="btn-run" class="action-btn run-btn">▶ รัน</button>
        </div>
      </div>

      <div class="goal-banner" id="goal-banner"></div>

      <div class="sandbox-bar hidden" id="sandbox-bar">
        <input type="text" id="sandbox-title-input" placeholder="ชื่อเมนู / ชื่อรุ่นมือถือ..." />
        <button id="btn-save-sandbox" class="action-btn sample-btn">💾 บันทึก</button>
      </div>

      <div id="code-dropzone" class="code-dropzone">
        <div class="empty-hint" id="empty-hint">ลากบล็อคจากด้านซ้ายมาวางที่นี่เท่านั้น (ไม่รองรับการคลิกเพิ่ม)</div>
      </div>
    </section>

    <!-- Right Column: 3D Viewport -->
    <section class="panel viewport-panel">
      <div class="panel-header">
        <h3>🧊 มุมมอง 3D</h3>
        <div class="cam-controls">
          <button id="btn-zoom-in" class="mini-btn" title="ซูมเข้า">➕</button>
          <button id="btn-zoom-out" class="mini-btn" title="ซูมออก">➖</button>
          <button id="btn-cam-reset" class="mini-btn" title="รีเซ็ต">🎯</button>
        </div>
      </div>
      <div class="canvas-wrapper">
        <canvas id="sim-canvas"></canvas>
        <div id="sim-status-toast" class="sim-toast">พร้อมทำงาน — ลากเมาส์หมุน 3D</div>
        <div id="result-modal" class="result-modal hidden"></div>
      </div>
    </section>
  </main>

  <div id="market-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>🛒 ร้านค้าวัตถุดิบ อะไหล่ & บล็อค</h2>
        <button id="btn-close-market" class="close-btn">✕</button>
      </div>
      <div class="market-tabs">
        <button class="m-tab active" data-mtab="blocks">⚡ บล็อค</button>
        <button class="m-tab" data-mtab="ingredients">🥩 วัตถุดิบ & อะไหล่</button>
      </div>
      <div id="market-items-grid" class="market-grid"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
